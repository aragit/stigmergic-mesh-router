services:
  redis:
    image: redis:7-alpine
    container_name: stigmergic-redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  router-1:
    build: .
    container_name: stigmergic-router-1
    depends_on:
      - redis
    ports:
      - "18000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./prometheus.yml:/app/prometheus.yml:ro
      - ./core:/app/core
      - ./api:/app/api
    environment:
      - STIGMERGIC_STORAGE_BACKEND=redis
      - STIGMERGIC_REDIS_HOST=redis
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  router-2:
    build: .
    container_name: stigmergic-router-2
    depends_on:
      - redis
    ports:
      - "18001:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./prometheus.yml:/app/prometheus.yml:ro
      - ./core:/app/core
      - ./api:/app/api
    environment:
      - STIGMERGIC_STORAGE_BACKEND=redis
      - STIGMERGIC_REDIS_HOST=redis
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: stigmergic-prometheus
    depends_on:
      - router-1
      - router-2
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Optional worker adapters — uncomment and configure as needed.
  # The API server falls back to mock workers from config.yaml if these
  # are not running.
