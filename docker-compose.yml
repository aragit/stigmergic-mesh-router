version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: stigmergic-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  router-1:
    build: .
    container_name: stigmergic-router-1
    depends_on:
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./core:/app/core
      - ./api:/app/api
    environment:
      - STIGMERGIC_STORAGE_BACKEND=redis
      - STIGMERGIC_REDIS_HOST=redis
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  router-2:
    build: .
    container_name: stigmergic-router-2
    depends_on:
      - redis
    ports:
      - "8001:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./core:/app/core
      - ./api:/app/api
    environment:
      - STIGMERGIC_STORAGE_BACKEND=redis
      - STIGMERGIC_REDIS_HOST=redis
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  worker-ollama:
    image: ollama/ollama:latest
    container_name: stigmergic-ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  worker-vllm:
    image: vllmai/vllm:latest
    container_name: stigmergic-vllm
    ports:
      - "8080:80"
    restart: unless-stopped
    command: --model facebook/opt-125m
