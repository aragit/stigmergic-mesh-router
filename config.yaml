decay_rate: 0.05
decay_interval_sec: 0.5
weights:
  alpha: 1.0   # success weight
  beta: 2.0    # latency weight
  gamma: 1.5   # saturation weight
  delta: 1.5   # capability fit weight
temperature: 0.5
server:
  host: "0.0.0.0"
  port: 8000
  workers:
    - node_id: "slm-fast"
      type: "mock"
      base_delay_sec: 0.03
      load_factor: 0.3
      capability_tags: ["slm", "fast", "low-latency"]
    - node_id: "llm-reasoner"
      type: "mock"
      base_delay_sec: 0.15
      load_factor: 0.5
      capability_tags: ["llm", "reasoning"]
    - node_id: "llm-balanced"
      type: "mock"
      base_delay_sec: 0.08
      load_factor: 0.4
      capability_tags: ["llm", "balanced"]
