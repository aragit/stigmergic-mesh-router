decay_rate: 0.05
decay_interval_sec: 0.5
weights:
  alpha: 1.0   # success weight
  beta: 2.0    # latency weight
  gamma: 1.5   # saturation weight
temperature: 0.5
server:
  host: "0.0.0.0"
  port: 8000
  workers:
    - node_id: "mock_node_0"
      type: "mock"
      base_delay_sec: 0.05
      load_factor: 0.5
    - node_id: "mock_node_1"
      type: "mock"
      base_delay_sec: 0.05
      load_factor: 0.5
    - node_id: "mock_node_2"
      type: "mock"
      base_delay_sec: 0.10
      load_factor: 0.5
