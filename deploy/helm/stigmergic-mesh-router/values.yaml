replicaCount: 3

image:
  repository: registry.barnabus.internal/stigmergic-mesh-router
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "stigmergic-router-sa"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  grpcPort: 50051
  httpPort: 8080
  metricsPort: 9090

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 15
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80
  customMetrics:
    entropyRateTarget: "150m"
    activeRoutesTarget: "500"

prometheusAdapter:
  enabled: true
  prometheusUrl: "http://prometheus-k8s.monitoring.svc.cluster.local:9090"

# KEDA ScaledObject: opt-in alternative autoscaler (disabled by default).
# The standard v2 HPA (see `autoscaling`) is the primary autoscaler; enabling
# KEDA swaps the custom-metrics backend via this chart's scaledobject.yaml.
keda:
  enabled: false

# Optional: PodDisruptionBudget (disabled by default).
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Optional: state checkpointing / warm-start (Phase 12). Disabled by default;
# values-prod.yaml enables it against a shared Redis URL with a local emptyDir.
checkpoints:
  enabled: false
  interval: 30
  storagePath: "/var/lib/stigmergic/checkpoints"
  redisUrl: ""

serviceMonitor:
  enabled: true
  namespace: "monitoring"
  interval: "15s"

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: stigmergic-mesh-router
          topologyKey: kubernetes.io/hostname

security:
  enabled: true
  defaultTenantKeys:
    - tenant_id: "tenant-default"
      key_hash: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      tier: "pro"
      rpm_limit: 600
      tpm_limit: 100000
      priority_weight: 1.0
