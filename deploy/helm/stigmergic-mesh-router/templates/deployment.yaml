apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stigmergic-mesh-router.fullname" . }}
  labels:
    {{- include "stigmergic-mesh-router.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "stigmergic-mesh-router.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "stigmergic-mesh-router.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          env:
            - name: STIGMERGIC_REDIS_URL
              value: "redis://stigmergic-redis:6379/0"
            - name: STIGMERGIC_WORKERS_JSON
              value: '[]'
            {{- if .Values.security.enabled }}
            - name: STIGMERGIC_SECURITY_ENABLED
              value: "true"
            - name: STIGMERGIC_DEFAULT_TENANT_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "stigmergic-mesh-router.fullname" . }}-secret
                  key: tenant-keys
            {{- end }}
            {{- if .Values.checkpoints.enabled }}
            - name: STIGMERGIC_CHECKPOINTS_ENABLED
              value: "true"
            - name: STIGMERGIC_CHECKPOINT_INTERVAL
              value: "{{ .Values.checkpoints.interval }}"
            - name: STIGMERGIC_CHECKPOINT_STORAGE_PATH
              value: "{{ .Values.checkpoints.storagePath }}"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.checkpoints.enabled }}
          volumeMounts:
            - name: checkpoint-store
              mountPath: {{ .Values.checkpoints.storagePath }}
          {{- end }}
      {{- if .Values.checkpoints.enabled }}
      volumes:
        - name: checkpoint-store
          emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
