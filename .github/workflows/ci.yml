name: Stigmergic Mesh Router CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Pytest Test Suite
        run: |
          pytest -v

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint Helm Chart (Production & Default Values)
        run: |
          helm lint deploy/helm/stigmergic-mesh-router
          helm lint deploy/helm/stigmergic-mesh-router -f deploy/helm/stigmergic-mesh-router/values-prod.yaml
